name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag/version mismatch: tag={tag}, package=v{version}")
          PY

      - name: Validate source
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          mypy src
          pytest -q
          agentsgen check . --all --ci

      - name: Build and verify artifacts
        run: |
          python -m build
          twine check dist/*
          python -m venv /tmp/agentsgen-wheel
          /tmp/agentsgen-wheel/bin/pip install dist/*.whl
          python scripts/release_smoke.py --exe /tmp/agentsgen-wheel/bin/agentsgen

      - name: Publish GitHub release with package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file "RELEASES/$GITHUB_REF_NAME.md" --verify-tag

      - name: Dispatch trusted PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-pypi.yml --ref main -f tag="$GITHUB_REF_NAME"
