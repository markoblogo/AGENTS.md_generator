name: SET

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: markoblogo/SET@v0.4.0
        with:
          agentsgen: "true"
          autodetect: "true"
          path: "."
          workflow_preset: "repo-docs"
          init: "true"
          pack: "true"
          check: "true"
          repomap: "true"
          snippets: "true"
          repomap_compact_budget: "4000"
          repomap_focus: "understand"
          proof_loop: "true"
          proof_task_id: "proof-loop-v0"
