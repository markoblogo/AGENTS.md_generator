name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff --version
          ruff format --check .
          ruff check .
      - name: Type check
        run: |
          mypy src
      - name: Unit tests
        run: |
          pytest -q

      - name: Build and verify installed wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
          python -m venv /tmp/agentsgen-wheel
          /tmp/agentsgen-wheel/bin/pip install dist/*.whl
          python scripts/release_smoke.py --exe /tmp/agentsgen-wheel/bin/agentsgen

  mcp-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install current MCP SDK and verify imports
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[mcp]"
          python -c "from mcp.server import MCPServer; import agentsgen.mcp_server; assert MCPServer"
