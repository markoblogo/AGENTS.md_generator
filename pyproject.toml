[project]
name = "agentsgen"
version = "0.5.1"
description = "Generate, preserve, and verify lean repo context for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

authors = [
  { name = "Anton" }
]

dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13,<16",
]

keywords = ["agents-md", "ai-agents", "developer-tools", "repo-context", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://agentsmd.abvx.xyz/"
Documentation = "https://agentsmd.abvx.xyz/"
Repository = "https://github.com/markoblogo/AGENTS.md_generator"
Issues = "https://github.com/markoblogo/AGENTS.md_generator/issues"
Changelog = "https://github.com/markoblogo/AGENTS.md_generator/blob/main/CHANGELOG.md"

[project.scripts]
agentsgen = "agentsgen.cli:main"
agents = "agentsgen.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=5,<8",
  "mypy>=1.11,<3",
  "hypothesis>=6.112,<7",
  "syrupy>=4.7,<7",
  # Pin ruff to keep CI formatting deterministic.
  "ruff==0.16.7"
]
llm = [
  "openai>=1.35,<4",
  "anthropic>=0.34,<2",
]
mcp = [
  "mcp>=1.9,<3",
]

[tool.ruff]
required-version = "0.16.7"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "agentsgen.actions",
  "agentsgen.cli",
  "agentsgen.cli_core",
  "agentsgen.cli_extra",
  "agentsgen.cli_pack",
  "agentsgen.cli_support",
  "agentsgen.cli_task",
  "agentsgen.mcp_server",
  "agentsgen.pack_engine",
  "agentsgen.task_loop",
  "agentsgen.understand",
  "agentsgen.understand_ast",
  "agentsgen.understand_context",
]
ignore_errors = true

[tool.pytest.ini_options]
addopts = "--cov=src/agentsgen --cov-report=term-missing --cov-fail-under=60"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
agentsgen = ["templates/**/*.tpl", "templates/**/*.md", "templates/**/*.j2", "presets/*.agentsgen.json"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
